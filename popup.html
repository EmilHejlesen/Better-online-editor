<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; font-family: system-ui, sans-serif; padding: 14px; }
    #hint { font-size: 12px; color: #888; margin-bottom: 10px; }
    kbd {
      background: #eee;
      border: 1px solid #bbb;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 11px;
    }
    #output {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      min-height: 40px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      background: #f9f9f9;
      color: #111;
    }
    #empty { color: #aaa; font-style: italic; font-size: 13px; }
  </style>
</head>
<body>
  <div id="hint">Select text on a page, then press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>U</kbd></div>
  <div id="output"><span id="empty">Nothing captured yet.</span></div>
  <script src="popup.js"></script>
</body>
</html>
